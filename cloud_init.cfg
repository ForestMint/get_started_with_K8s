# cloud-init configuration file to enable SSH for user 'alice' with password only

# Set the user details
users:
  - name: alice
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]  # Optional: grant sudo without password
    groups: users
    ssh-authorized-keys: []  # No SSH keys for 'alice'

# Disable SSH key authentication
ssh_pwauth: true  # Enable password authentication for SSH
disable_root: false  # Keep root access enabled (optional)
chpasswd:
  list: |
    alice:password123  # Set 'alice' user's password
  expire: false

# Ensure sshd is configured to allow password authentication
ssh:
  allow-pw: true  # Allow password authentication
  disable_root: false  # Optionally allow root login, set true to disable