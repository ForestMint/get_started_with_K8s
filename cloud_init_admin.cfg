#cloud-config
users:
  - name: alice
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]  # Optional: grant passwordless sudo
    groups: users
    ssh-authorized-keys: []  # No SSH keys
    lock_passwd: false  # Allow password-based login

ssh_pwauth: true  # Enable SSH password authentication
disable_root: false  # Allow root login (set to true to disable)

chpasswd:
  list: |
    alice:password123
  expire: false

# Optional: ensure SSH daemon allows password authentication
runcmd:









  - sed -i '/^127\.0\.0\.1 localhost$/a 127.0.1.1 ubuntu' /etc/hosts











  - set -e

  # Disk and mount point
  - DISK="/dev/vdb"
  - MOUNT_POINT="/mnt/vdb"


  # Create a single partition on the disk using parted (non-interactive)

  - sudo parted -s "$DISK" mklabel gpt
  - sudo parted -s "$DISK" mkpart primary ext4 0% 100%


  # Get the partition name (usually /dev/vdb1)
  - PARTITION="${DISK}1"

  # Create an ext4 filesystem on the partition

  - sudo mkfs.ext4 -F "$PARTITION"

  # Create mount point if it doesn't exist
  - sudo mkdir -p "$MOUNT_POINT"

  # Mount the partition
  - sudo mount "$PARTITION" "$MOUNT_POINT"

  # Set permissions so the current user can write to it
  - sudo chown $(whoami):$(whoami) "$MOUNT_POINT"














  - sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config
  - systemctl restart sshd



















  - sudo bash -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf' # temporarily use Google's DNS

  # Update and install dependencies

  - sudo apt update
  - sudo apt install -y apt-transport-https ca-certificates curl gpg

  # Add the Kubernetes GPG key

  - sudo mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

  # Add the Kubernetes APT repository

  - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list

  - # Update package lists

  - sudo apt update

  - # Install kubectl

  - sudo apt install -y kubectl

  - # Prevent automatic updates (optional but recommended)

  - sudo apt-mark hold kubectl